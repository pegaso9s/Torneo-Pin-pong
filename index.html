<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torneo de Table Tennis / Ping Pong</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --win: #22c55e;
      --loss: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; max-width: 1200px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 2.2rem; color: var(--accent); margin-bottom: 5px; }
    header p { color: var(--text-muted); }

    .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; }
    .tab-btn { background-color: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .tab-btn.active, .tab-btn:hover { background-color: var(--accent); color: #000; border-color: var(--accent); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Tablas */
    .table-container { overflow-x: auto; background-color: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: center; }
    th, td { padding: 14px 10px; border-bottom: 1px solid var(--border); }
    th { background-color: #111827; color: var(--accent); font-size: 0.9rem; text-transform: uppercase; }
    tr:hover { background-color: rgba(255, 255, 255, 0.02); }
    tr.qualified { background-color: rgba(56, 189, 248, 0.08); }
    .pos { font-weight: bold; }
    .player-name { text-align: left; font-weight: 600; }

    /* Listado Partidos */
    .matches-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
    .match-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .match-header { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; display: flex; justify-content: space-between; }
    .team-row { display: flex; justify-content: space-between; align-items: center; }
    .team-name { font-weight: 600; width: 45%; }
    .score-inputs { display: flex; gap: 6px; align-items: center; }
    .score-inputs input { width: 45px; height: 35px; background: var(--bg-color); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); text-align: center; font-size: 1rem; font-weight: bold; }
    .score-inputs input:focus { border-color: var(--accent); outline: none; }
    .btn-save { width: 100%; margin-top: 5px; background: var(--accent); color: #000; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-save:hover { background: var(--accent-hover); color: white; }

    /* Bracket Cuartos */
    .bracket { display: flex; flex-direction: column; gap: 20px; max-width: 600px; margin: 0 auto; }
    .bracket-match { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; }
    .bracket-title { font-size: 0.85rem; color: var(--accent); font-weight: bold; margin-bottom: 8px; }

    /* Responsive */
    @media (max-width: 600px) {
      body { padding: 10px; }
      th, td { padding: 8px 4px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🏓 TORNEO DE PING PONG 🏓</h1>
    <p>Fase 1: Liga Todos contra Todos (66 Partidos)</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('clasificacion')">🏆 Clasificación</button>
    <button class="tab-btn" onclick="switchTab('partidos')">⚔️ Cargar Resultados</button>
    <button class="tab-btn" onclick="switchTab('fasefinal')">🔥 Fase Final</button>
  </div>

  <!-- TAB 1: CLASIFICACIÓN -->
  <div id="clasificacion" class="tab-content active">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Pos</th>
            <th style="text-align:left;">Jugador</th>
            <th>PTS</th>
            <th>PJ</th>
            <th>PG</th>
            <th>PP</th>
            <th>SF</th>
            <th>SC</th>
            <th>DS</th>
            <th>DP</th>
          </tr>
        </thead>
        <tbody id="tabla-body">
          <!-- Generado con JS -->
        </tbody>
      </table>
    </div>
    <p style="margin-top: 15px; font-size: 0.85rem; color: var(--text-muted); text-align: center;">
      * Los primeros 8 clasifican a Cuartos de Final.<br>
      Criterios de desempate: 1° Puntos | 2° Dif. Sets (DS) | 3° Dif. Puntos (DP)
    </p>
  </div>

  <!-- TAB 2: PARTIDOS -->
  <div id="partidos" class="tab-content">
    <div class="matches-grid" id="lista-partidos">
      <!-- Generado con JS -->
    </div>
  </div>

  <!-- TAB 3: FASE FINAL -->
  <div id="fasefinal" class="tab-content">
    <div class="bracket">
      <h2 style="text-align:center; color: var(--accent); margin-bottom: 10px;">Cuartos de Final</h2>
      <div id="cuartos-container">
        <!-- Generado dinámicamente según la tabla -->
      </div>
    </div>
  </div>

  <script>
    // LISTA DE JUGADORES
    const jugadoresNombres = [
      "TC Albarracín", "TC Shadow", "TE Torres", "T2 Rock", 
      "T2 Parra", "T2 Urueña", "ST Díaz", "ST Castro", 
      "ST Burgos", "ST Ocaña", "ST Cubides", "T1 Narváez"
    ];

    let partidos = [];

    // Inicializar o Cargar de LocalStorage
    function init() {
      const localData = localStorage.getItem('pingpong_partidos');
      if (localData) {
        partidos = JSON.parse(localData);
      } else {
        generarCalendario();
        guardarEnStorage();
      }
      renderizarTabla();
      renderizarPartidos();
      renderizarFaseFinal();
    }

    // Generar 66 Partidos (Todos contra todos)
    function generarCalendario() {
      partidos = [];
      let id = 1;
      for (let i = 0; i < jugadoresNombres.length; i++) {
        for (let j = i + 1; j < jugadoresNombres.length; j++) {
          partidos.push({
            id: id++,
            j1: jugadoresNombres[i],
            j2: jugadoresNombres[j],
            sets1: null,
            sets2: null,
            pts1: null,
            pts2: null,
            jugado: false
          });
        }
      }
    }

    function guardarEnStorage() {
      localStorage.setItem('pingpong_partidos', JSON.stringify(partidos));
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');

      if(tabId === 'clasificacion') renderizarTabla();
      if(tabId === 'fasefinal') renderizarFaseFinal();
    }

    // Calcular Estadísticas y Renderizar Tabla
    function renderizarTabla() {
      let stats = {};
      jugadoresNombres.forEach(nombre => {
        stats[nombre] = { nombre, pts: 0, pj: 0, pg: 0, pp: 0, sf: 0, sc: 0, ds: 0, pf: 0, pc: 0, dp: 0 };
      });

      partidos.forEach(p => {
        if (p.jugado) {
          // Jugador 1
          stats[p.j1].pj++;
          stats[p.j1].sf += p.sets1;
          stats[p.j1].sc += p.sets2;
          stats[p.j1].pf += p.pts1;
          stats[p.j1].pc += p.pts2;

          // Jugador 2
          stats[p.j2].pj++;
          stats[p.j2].sf += p.sets2;
          stats[p.j2].sc += p.sets1;
          stats[p.j2].pf += p.pts2;
          stats[p.j2].pc += p.pts1;

          if (p.sets1 > p.sets2) {
            stats[p.j1].pg++;
            stats[p.j1].pts += 3;
            stats[p.j2].pp++;
          } else {
            stats[p.j2].pg++;
            stats[p.j2].pts += 3;
            stats[p.j1].pp++;
          }
        }
      });

      // Calcular diferencias
      let tabla = Object.values(stats).map(s => {
        s.ds = s.sf - s.sc;
        s.dp = s.pf - s.pc;
        return s;
      });

      // Ordenar: 1. Puntos, 2. Diferencia de Sets, 3. Diferencia de Puntos
      tabla.sort((a, b) => {
        if (b.pts !== a.pts) return b.pts - a.pts;
        if (b.ds !== a.ds) return b.ds - a.ds;
        return b.dp - a.dp;
      });

      const tbody = document.getElementById('tabla-body');
      tbody.innerHTML = '';

      tabla.forEach((j, index) => {
        const tr = document.createElement('tr');
        if (index < 8) tr.classList.add('qualified');
        
        tr.innerHTML = `
          <td class="pos">${index + 1}°</td>
          <td class="player-name">${j.nombre}</td>
          <td><strong>${j.pts}</strong></td>
          <td>${j.pj}</td>
          <td>${j.pg}</td>
          <td>${j.pp}</td>
          <td>${j.sf}</td>
          <td>${j.sc}</td>
          <td style="color:${j.ds > 0 ? 'var(--win)' : j.ds < 0 ? 'var(--loss)' : 'inherit'}">${j.ds > 0 ? '+'+j.ds : j.ds}</td>
          <td style="color:${j.dp > 0 ? 'var(--win)' : j.dp < 0 ? 'var(--loss)' : 'inherit'}">${j.dp > 0 ? '+'+j.dp : j.dp}</td>
        `;
        tbody.appendChild(tr);
      });

      window.tablaActual = tabla; // Guardar referencia para Cuartos
    }

    // Renderizar Cards de partidos para cargar resultados
    function renderizarPartidos() {
      const container = document.getElementById('lista-partidos');
      container.innerHTML = '';

      partidos.forEach(p => {
        const card = document.createElement('div');
        card.className = 'match-card';
        card.innerHTML = `
          <div class="match-header">
            <span>Partido #${p.id}</span>
            <span style="color:${p.jugado ? 'var(--win)' : 'var(--text-muted)'}">${p.jugado ? '✓ Finalizado' : 'Pendiente'}</span>
          </div>
          
          <div class="team-row">
            <span class="team-name">${p.j1}</span>
            <div class="score-inputs">
              <input type="number" placeholder="Sets" id="s1-${p.id}" value="${p.sets1 !== null ? p.sets1 : ''}" min="0">
              <input type="number" placeholder="Pts" id="p1-${p.id}" value="${p.pts1 !== null ? p.pts1 : ''}" min="0">
            </div>
          </div>

          <div class="team-row">
            <span class="team-name">${p.j2}</span>
            <div class="score-inputs">
              <input type="number" placeholder="Sets" id="s2-${p.id}" value="${p.sets2 !== null ? p.sets2 : ''}" min="0">
              <input type="number" placeholder="Pts" id="p2-${p.id}" value="${p.pts2 !== null ? p.pts2 : ''}" min="0">
            </div>
          </div>

          <button class="btn-save" onclick="guardarPartido(${p.id})">Guardar Resultado</button>
        `;
        container.appendChild(card);
      });
    }

    // Guardar resultado de un partido
    function guardarPartido(id) {
      const s1 = parseInt(document.getElementById(`s1-${id}`).value);
      const p1 = parseInt(document.getElementById(`p1-${id}`).value);
      const s2 = parseInt(document.getElementById(`s2-${id}`).value);
      const p2 = parseInt(document.getElementById(`p2-${id}`).value);

      if (isNaN(s1) || isNaN(p1) || isNaN(s2) || isNaN(p2)) {
        alert("Por favor completa los campos de Sets y Puntos para ambos jugadores.");
        return;
      }

      if (s1 === s2) {
        alert("En Sets debe haber un ganador (no pueden empatar en sets).");
        return;
      }

      const matchIndex = partidos.findIndex(p => p.id === id);
      partidos[matchIndex].sets1 = s1;
      partidos[matchIndex].pts1 = p1;
      partidos[matchIndex].sets2 = s2;
      partidos[matchIndex].pts2 = p2;
      partidos[matchIndex].jugado = true;

      guardarEnStorage();
      alert(`Partido #${id} guardado correctamente.`);
      renderizarPartidos();
    }

    // Dibujar los cruces de Cuartos de Final
    function renderizarFaseFinal() {
      if (!window.tablaActual) renderizarTabla();
      const t = window.tablaActual;
      const container = document.getElementById('cuartos-container');
      
      const cruces = [
        { c: "Llave 1", j1: t[0], j2: t[7], pos1: "1°", pos2: "8°" },
        { c: "Llave 2", j1: t[3], j2: t[4], pos1: "4°", pos2: "5°" },
        { c: "Llave 3", j1: t[1], j2: t[6], pos1: "2°", pos2: "7°" },
        { c: "Llave 4", j1: t[2], j2: t[5], pos1: "3°", pos2: "6°" }
      ];

      container.innerHTML = '';
      cruces.forEach(cruce => {
        const match = document.createElement('div');
        match.className = 'bracket-match';
        match.innerHTML = `
          <div class="bracket-title">${cruce.c}</div>
          <div style="display:flex; justify-between; margin-bottom: 5px;">
            <span><strong>${cruce.pos1}</strong> ${cruce.j1.nombre}</span>
          </div>
          <div style="display:flex; justify-between;">
            <span><strong>${cruce.pos2}</strong> ${cruce.j2.nombre}</span>
          </div>
        `;
        container.appendChild(match);
      });
    }

    // Iniciar App
    init();
  </script>
  
</body>
</html>
