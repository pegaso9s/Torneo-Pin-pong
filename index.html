<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torneo de Ping Pong - En Vivo</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --win: #22c55e;
      --loss: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; max-width: 1200px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 2.2rem; color: var(--accent); margin-bottom: 5px; }
    header p { color: var(--text-muted); }

    .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; }
    .tab-btn { background-color: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .tab-btn.active, .tab-btn:hover { background-color: var(--accent); color: #000; border-color: var(--accent); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Tablas */
    .table-container { overflow-x: auto; background-color: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: center; }
    th, td { padding: 14px 10px; border-bottom: 1px solid var(--border); }
    th { background-color: #111827; color: var(--accent); font-size: 0.9rem; text-transform: uppercase; }
    tr:hover { background-color: rgba(255, 255, 255, 0.02); }
    tr.qualified { background-color: rgba(56, 189, 248, 0.08); }
    .pos { font-weight: bold; }
    .player-name { text-align: left; font-weight: 600; }

    /* Listado Partidos */
    .matches-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
    .match-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .match-header { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; display: flex; justify-content: space-between; }
    .round-tag { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .team-row { display: flex; justify-content: space-between; align-items: center; }
    .team-name { font-weight: 600; width: 45%; }
    .score-inputs { display: flex; gap: 6px; align-items: center; }
    .score-inputs input { width: 45px; height: 35px; background: var(--bg-color); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); text-align: center; font-size: 1rem; font-weight: bold; }
    .score-inputs input:focus { border-color: var(--accent); outline: none; }
    .btn-save { width: 100%; margin-top: 5px; background: var(--accent); color: #000; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-save:hover { background: var(--accent-hover); color: white; }

    /* Bracket Cuartos */
    .bracket { display: flex; flex-direction: column; gap: 20px; max-width: 600px; margin: 0 auto; }
    .bracket-match { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; }
    .bracket-title { font-size: 0.85rem; color: var(--accent); font-weight: bold; margin-bottom: 8px; }

    @media (max-width: 600px) {
      body { padding: 10px; }
      th, td { padding: 8px 4px; font-size: 0.85rem; }
    }
  </style>

  <!-- Cargar Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <header>
    <h1>🏓 TORNEO DE PING PONG 🏓</h1>
    <p>Resultados y Clasificación en Tiempo Real</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('clasificacion', event)">🏆 Clasificación</button>
    <button class="tab-btn" onclick="switchTab('partidos', event)">⚔️ Cargar Resultados</button>
    <button class="tab-btn" onclick="switchTab('fasefinal', event)">🔥 Fase Final</button>
  </div>

  <div id="clasificacion" class="tab-content active">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Pos</th>
            <th style="text-align:left;">Jugador</th>
            <th>PTS</th>
            <th>PJ</th>
            <th>PG</th>
            <th>PP</th>
            <th>SF</th>
            <th>SC</th>
            <th>DS</th>
            <th>DP</th>
          </tr>
        </thead>
        <tbody id="tabla-body"></tbody>
      </table>
    </div>
  </div>

  <div id="partidos" class="tab-content">
    <div class="matches-grid" id="lista-partidos"></div>
  </div>

  <div id="fasefinal" class="tab-content">
    <div class="bracket">
      <h2 style="text-align:center; color: var(--accent); margin-bottom: 10px;">Cuartos de Final</h2>
      <div id="cuartos-container"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCzZJ1X0fq9F_1Daveejq_vWa6kvcHGosU",
      authDomain: "torneo-pin-pong.firebaseapp.com",
      databaseURL: "https://torneo-pin-pong-default-rtdb.firebaseio.com",
      projectId: "torneo-pin-pong",
      storageBucket: "torneo-pin-pong.firebasestorage.app",
      messagingSenderId: "3677906782",
      appId: "1:3677906782:web:e71cbbcdb8406516cc91cf",
      measurementId: "G-Z9XNHGPEWR"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const jugadoresNombres = [
      "TC Albarracín", "TC Shadow", "TE Torres", "T2 Rock", 
      "T2 Parra", "T2 Urueña", "ST Díaz", "ST Castro", 
      "ST Burgos", "ST Ocaña", "ST Cubides", "T1 Narváez"
    ];

    let partidos = [];

    // Escuchar cambios en vivo desde Firebase
    db.ref('partidos').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data && Array.isArray(data) && data.length > 0) {
        partidos = data;
      } else {
        generarCalendarioVariado();
      }
      renderizarTabla();
      renderizarPartidos();
      renderizarFaseFinal();
    });

    // Algoritmo Round-Robin para generar 11 rondas variadas con todos jugando
    function generarCalendarioVariado() {
      let iniciales = [];
      let pool = [...jugadoresNombres];
      let numJugadores = pool.length; // 12
      let rondas = numJugadores - 1;   // 11 rondas
      let id = 1;

      for (let r = 0; r < rondas; r++) {
        for (let i = 0; i < numJugadores / 2; i++) {
          let p1 = pool[i];
          let p2 = pool[numJugadores - 1 - i];
          
          iniciales.push({
            id: id++,
            ronda: r + 1,
            j1: p1,
            j2: p2,
            sets1: null,
            sets2: null,
            pts1: null,
            pts2: null,
            jugado: false
          });
        }

        // Rotar array manteniendo el primer jugador fijo
        pool.splice(1, 0, pool.pop());
      }

      db.ref('partidos').set(iniciales);
    }

    function switchTab(tabId, evt) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');
    }

    function renderizarTabla() {
      let stats = {};
      jugadoresNombres.forEach(nombre => {
        stats[nombre] = { nombre, pts: 0, pj: 0, pg: 0, pp: 0, sf: 0, sc: 0, ds: 0, pf: 0, pc: 0, dp: 0 };
      });

      partidos.forEach(p => {
        if (p && p.jugado) {
          stats[p.j1].pj++; stats[p.j1].sf += p.sets1; stats[p.j1].sc += p.sets2; stats[p.j1].pf += p.pts1; stats[p.j1].pc += p.pts2;
          stats[p.j2].pj++; stats[p.j2].sf += p.sets2; stats[p.j2].sc += p.sets1; stats[p.j2].pf += p.pts2; stats[p.j2].pc += p.pts1;

          if (p.sets1 > p.sets2) {
            stats[p.j1].pg++; stats[p.j1].pts += 3; stats[p.j2].pp++;
          } else {
            stats[p.j2].pg++; stats[p.j2].pts += 3; stats[p.j1].pp++;
          }
        }
      });

      let tabla = Object.values(stats).map(s => {
        s.ds = s.sf - s.sc;
        s.dp = s.pf - s.pc;
        return s;
      });

      tabla.sort((a, b) => (b.pts !== a.pts) ? b.pts - a.pts : (b.ds !== a.ds) ? b.ds - a.ds : b.dp - a.dp);

      const tbody = document.getElementById('tabla-body');
      tbody.innerHTML = '';
      tabla.forEach((j, index) => {
        const tr = document.createElement('tr');
        if (index < 8) tr.classList.add('qualified');
        tr.innerHTML = `
          <td class="pos">${index + 1}°</td>
          <td class="player-name">${j.nombre}</td>
          <td><strong>${j.pts}</strong></td>
          <td>${j.pj}</td>
          <td>${j.pg}</td>
          <td>${j.pp}</td>
          <td>${j.sf}</td>
          <td>${j.sc}</td>
          <td style="color:${j.ds > 0 ? 'var(--win)' : j.ds < 0 ? 'var(--loss)' : 'inherit'}">${j.ds > 0 ? '+'+j.ds : j.ds}</td>
          <td style="color:${j.dp > 0 ? 'var(--win)' : j.dp < 0 ? 'var(--loss)' : 'inherit'}">${j.dp > 0 ? '+'+j.dp : j.dp}</td>
        `;
        tbody.appendChild(tr);
      });

      window.tablaActual = tabla;
    }

    function renderizarPartidos() {
      const container = document.getElementById('lista-partidos');
      container.innerHTML = '';

      partidos.forEach(p => {
        if (!p) return;
        const card = document.createElement('div');
        card.className = 'match-card';
        card.innerHTML = `
          <div class="match-header">
            <span>Partido #${p.id} <span class="round-tag">Ronda ${p.ronda || 1}</span></span>
            <span style="color:${p.jugado ? 'var(--win)' : 'var(--text-muted)'}">${p.jugado ? '✓ Finalizado' : 'Pendiente'}</span>
          </div>
          <div class="team-row">
            <span class="team-name">${p.j1}</span>
            <div class="score-inputs">
              <input type="number" placeholder="Sets" id="s1-${p.id}" value="${p.sets1 !== null ? p.sets1 : ''}">
              <input type="number" placeholder="Pts" id="p1-${p.id}" value="${p.pts1 !== null ? p.pts1 : ''}">
            </div>
          </div>
          <div class="team-row">
            <span class="team-name">${p.j2}</span>
            <div class="score-inputs">
              <input type="number" placeholder="Sets" id="s2-${p.id}" value="${p.sets2 !== null ? p.sets2 : ''}">
              <input type="number" placeholder="Pts" id="p2-${p.id}" value="${p.pts2 !== null ? p.pts2 : ''}">
            </div>
          </div>
          <button class="btn-save" onclick="guardarPartido(${p.id})">Guardar en Vivo</button>
        `;
        container.appendChild(card);
      });
    }

    function guardarPartido(id) {
      const s1 = parseInt(document.getElementById(`s1-${id}`).value);
      const p1 = parseInt(document.getElementById(`p1-${id}`).value);
      const s2 = parseInt(document.getElementById(`s2-${id}`).value);
      const p2 = parseInt(document.getElementById(`p2-${id}`).value);

      if (isNaN(s1) || isNaN(p1) || isNaN(s2) || isNaN(p2) || s1 === s2) {
        alert("Ingresa valores válidos y asegúrate de que haya un ganador en Sets.");
        return;
      }

      const matchIndex = partidos.findIndex(p => p && p.id === id);
      partidos[matchIndex].sets1 = s1;
      partidos[matchIndex].pts1 = p1;
      partidos[matchIndex].sets2 = s2;
      partidos[matchIndex].pts2 = p2;
      partidos[matchIndex].jugado = true;

      db.ref('partidos').set(partidos);
    }

    function renderizarFaseFinal() {
      if (!window.tablaActual) return;
      const t = window.tablaActual;
      const container = document.getElementById('cuartos-container');
      const cruces = [
        { c: "Llave 1", j1: t[0], j2: t[7], pos1: "1°", pos2: "8°" },
        { c: "Llave 2", j1: t[3], j2: t[4], pos1: "4°", pos2: "5°" },
        { c: "Llave 3", j1: t[1], j2: t[6], pos1: "2°", pos2: "7°" },
        { c: "Llave 4", j1: t[2], j2: t[5], pos1: "3°", pos2: "6°" }
      ];

      container.innerHTML = '';
      cruces.forEach(cruce => {
        const match = document.createElement('div');
        match.className = 'bracket-match';
        match.innerHTML = `
          <div class="bracket-title">${cruce.c}</div>
          <div style="margin-bottom: 5px;"><strong>${cruce.pos1}</strong> ${cruce.j1.nombre}</div>
          <div><strong>${cruce.pos2}</strong> ${cruce.j2.nombre}</div>
        `;
        container.appendChild(match);
      });
    }
  </script>
</body>
</html>
